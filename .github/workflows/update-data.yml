name: Update player data

# Regenerates every sport's published data and commits it, so the app picks up
# roster changes and new daily puzzles without an App Store release:
#   MLB  data/notable.json, data/daily.json      (MLB Stats API)
#   NBA  data/nba.json,     data/nba_daily.json  (ESPN)
#   NFL  data/nfl.json,     data/nfl_daily.json  (ESPN)
#   NHL  data/nhl.json,     data/nhl_daily.json  (ESPN)

on:
  schedule:
    # 09:00 UTC — early morning in ET, after any overnight transactions post and
    # well before the ET day boundary the app uses for the daily puzzle.
    - cron: "0 9 * * *"
  workflow_dispatch:

# Avoid two runs racing to push the same files.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install — the generator is standard library only.
      - name: Generate MLB data
        run: python3 scripts/generate_data.py

      - name: Generate NBA data
        run: python3 scripts/generate_nba.py

      - name: Generate NFL data
        run: python3 scripts/generate_nfl.py

      - name: Generate NHL data
        run: python3 scripts/generate_nhl.py

      - name: Sanity-check output
        run: |
          python3 - <<'PY'
          import json, sys
          notable = json.load(open("data/notable.json"))
          daily   = json.load(open("data/daily.json"))

          if notable["count"] < 100:
              sys.exit(f"notable pack too small: {notable['count']}")
          if len(notable["players"]) != notable["count"]:
              sys.exit("notable count does not match players array")
          if any(not p.get("mlbID") for p in notable["players"]):
              sys.exit("notable entry missing mlbID")
          if len(daily["picks"]) < 7:
              sys.exit(f"daily schedule too short: {len(daily['picks'])}")

          known = {p["mlbID"] for p in notable["players"]}
          unknown = [d for d, pid in daily["picks"].items() if pid not in known]
          # Past dates may reference someone who has since left the pack; only
          # future picks have to be answerable.
          import datetime
          today = datetime.date.today().isoformat()
          future_unknown = [d for d in unknown if d >= today]
          if future_unknown:
              sys.exit(f"future daily picks not in notable pack: {future_unknown[:5]}")

          print(f"OK: {notable['count']} notable, {len(daily['picks'])} daily dates")

          nba       = json.load(open("data/nba.json"))
          nba_daily = json.load(open("data/nba_daily.json"))
          if nba["count"] < 200:
              sys.exit(f"nba player set too small: {nba['count']}")
          missing = [p["fullName"] for p in nba["players"]
                     if not p.get("career", {}).get("stats")
                     or not p.get("season", {}).get("stats")]
          if missing:
              sys.exit(f"nba players missing season/career stats: {missing[:5]}")

          # The Notables pack is the free default and the daily pool, so it has
          # to be populated and every future pick has to be answerable from it.
          notables = {p["id"] for p in nba["players"] if p.get("notable")}
          if len(notables) < 100:
              sys.exit(f"nba notables too small: {len(notables)}")
          if len(nba_daily["picks"]) < 7:
              sys.exit(f"nba daily schedule too short: {len(nba_daily['picks'])}")
          stray = [d for d, pid in nba_daily["picks"].items()
                   if d >= today and pid not in notables]
          if stray:
              sys.exit(f"future nba daily picks not in notables: {stray[:5]}")
          if any(not p.get("headshot") for p in nba["players"]):
              print("WARNING: some NBA players have no headshot", file=sys.stderr)
          print(f"OK: {nba['count']} NBA players ({len(notables)} notable), "
                f"{len(nba_daily['picks'])} daily dates, season {nba['season']}")

          nfl       = json.load(open("data/nfl.json"))
          nfl_daily = json.load(open("data/nfl_daily.json"))
          if nfl["count"] < 500:
              sys.exit(f"nfl player set too small: {nfl['count']}")
          groups = set(nfl["statKeys"]["byGroup"])
          # Every player must be readable: a role the app has no stat set for
          # would render an empty card.
          stray = {p["group"] for p in nfl["players"]} - groups
          if stray:
              sys.exit(f"nfl players in unknown position groups: {sorted(stray)}")
          # And must carry the stats their own role is compared on.
          for p in nfl["players"]:
              primary = nfl["statKeys"]["primaryByGroup"][p["group"]]
              if not any(k in p["career"]["stats"] for k in primary):
                  sys.exit(f"nfl player with no career stats for their role: {p['fullName']}")
              if not p.get("season", {}).get("stats"):
                  sys.exit(f"nfl player missing a season line: {p['fullName']}")

          notables = {p["id"] for p in nfl["players"] if p.get("notable")}
          if len(notables) < 100:
              sys.exit(f"nfl notables too small: {len(notables)}")
          if len(nfl_daily["picks"]) < 7:
              sys.exit(f"nfl daily schedule too short: {len(nfl_daily['picks'])}")
          stray = [d for d, pid in nfl_daily["picks"].items()
                   if d >= today and pid not in notables]
          if stray:
              sys.exit(f"future nfl daily picks not in notables: {stray[:5]}")
          print(f"OK: {nfl['count']} NFL players ({len(notables)} notable), "
                f"{len(nfl_daily['picks'])} daily dates, season {nfl['season']}")

          nhl       = json.load(open("data/nhl.json"))
          nhl_daily = json.load(open("data/nhl_daily.json"))
          if nhl["count"] < 400:
              sys.exit(f"nhl player set too small: {nhl['count']}")
          groups = set(nhl["statKeys"]["byGroup"])
          stray = {p["group"] for p in nhl["players"]} - groups
          if stray:
              sys.exit(f"nhl players in unknown position groups: {sorted(stray)}")
          for p in nhl["players"]:
              primary = nhl["statKeys"]["primaryByGroup"][p["group"]]
              if not any(k in p["career"]["stats"] for k in primary):
                  sys.exit(f"nhl player with no career stats for their role: {p['fullName']}")
              if not p.get("season", {}).get("stats"):
                  sys.exit(f"nhl player missing a season line: {p['fullName']}")

          notables = {p["id"] for p in nhl["players"] if p.get("notable")}
          if len(notables) < 100:
              sys.exit(f"nhl notables too small: {len(notables)}")
          # Goalies are a reserved share of the pack on purpose: ranked against
          # skaters they score nothing and the daily would never be one.
          keepers = sum(1 for p in nhl["players"]
                        if p.get("notable") and p["group"] == "Goalie")
          if keepers < 10:
              sys.exit(f"nhl notables have too few goalies: {keepers}")
          if len(nhl_daily["picks"]) < 7:
              sys.exit(f"nhl daily schedule too short: {len(nhl_daily['picks'])}")
          stray = [d for d, pid in nhl_daily["picks"].items()
                   if d >= today and pid not in notables]
          if stray:
              sys.exit(f"future nhl daily picks not in notables: {stray[:5]}")
          print(f"OK: {nhl['count']} NHL players ({len(notables)} notable, "
                f"{keepers} goalies), {len(nhl_daily['picks'])} daily dates, "
                f"season {nhl['season']}")
          PY

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data docs/data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "Update player data ($(date -u +%Y-%m-%d))"
          git push
